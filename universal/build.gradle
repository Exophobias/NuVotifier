import com.github.jengelman.gradle.plugins.shadow.relocation.SimpleRelocator
import com.github.jengelman.gradle.plugins.shadow.transformers.ResourceTransformer
import com.github.jengelman.gradle.plugins.shadow.transformers.TransformerContext
import org.apache.tools.zip.ZipEntry
import org.apache.tools.zip.ZipOutputStream
import org.gradle.api.file.FileTreeElement

plugins {
    id 'com.gradleup.shadow'
}

class NettyEpollTransformer implements ResourceTransformer {
    private byte[] nativeLibrary

    boolean canTransformResource(FileTreeElement element) {
        return element.name.endsWith('libnetty_transport_native_epoll_x86_64.so')
    }

    void transform(TransformerContext context) {
        nativeLibrary = context.inputStream.bytes
    }

    boolean hasTransformedResource() { nativeLibrary != null }

    void modifyOutputStream(ZipOutputStream output, boolean preserveFileTimestamps) {
        ZipEntry entry = new ZipEntry('META-INF/native/libcom_vexsoftware_votifier_netty_transport_native_epoll_x86_64.so')
        // ZIP stores local DOS time. Match Gradle's reproducible date in every build timezone.
        entry.time = java.time.LocalDateTime.of(1980, 2, 1, 0, 0)
                .atZone(java.time.ZoneId.systemDefault()).toInstant().toEpochMilli()
        output.putNextEntry(entry)
        output.write(nativeLibrary)
        output.closeEntry()
    }
}

dependencies {
    implementation project(':nuvotifier-api')
    implementation project(':nuvotifier-common')
    implementation project(':nuvotifier-bukkit')
}

def shadedJar = tasks.named('shadowJar') {
    archiveBaseName = 'nuvotifier-bukkit'
    relocate 'io.netty', 'com.vexsoftware.votifier.io.netty'
    relocate 'org.json', 'com.vexsoftware.votifier.json'
    relocate new SimpleRelocator('com.google.code', 'com.vexsoftware.votifier.google.code', [], ['com.vexsoftware.votifier.sponge'])
    relocate 'com.google.gson', 'com.vexsoftware.votifier.google.gson'
    relocate 'org.apache.commons.io', 'com.vexsoftware.votifier.commons.io'

    transform(NettyEpollTransformer.class)
}

tasks.register('linkLatest', Copy) {
    from(shadedJar.flatMap { it.archiveFile })
    into(layout.buildDirectory.dir('libs'))
    rename { 'nuvotifier-bukkit.jar' }
}

tasks.named('build') {
    dependsOn tasks.named('linkLatest')
}
