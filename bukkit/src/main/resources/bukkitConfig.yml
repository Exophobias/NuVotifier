# Configuration schema, independent of the plugin version. Legacy files migrate from schema 0.
config-version: 1

# The IP to listen to. Use 0.0.0.0 if you wish to listen to all interfaces on your server. (All IP addresses)
# This defaults to the IP you have configured your server to listen on, or 0.0.0.0 if you have not configured this.
# Use a literal IPv4 or IPv6 address; DNS hostnames are refused to keep activation bounded.
host: '%ip%'

# Port to listen for new votes on
port: 8192

# Authenticated protocol v2 is required. Setting this to false is refused without rewriting it.
# Legacy v1 does not authenticate the sender and is unsupported by this receiver.
disable-v1-protocol: true

# Detailed vote diagnostics may contain player names and addresses. Leave disabled in production.
# An existing legacy quiet flag, when present, still takes precedence over this setting.
debug: false

# All tokens, labeled by the serviceName of each server list.
tokens:
  # Default token for all server lists, if another isn't supplied.
  default: %default_token%

# Receive authenticated protocol v2 forwarding through the TCP listener above.
# Client-carried plugin messages have no sender authentication and are refused by this receiver.
forwarding:
  # Supported method: none. Configure proxy senders to use protocol v2 TCP forwarding.
  method: none
  # Retained for compatibility with existing configuration values; this transport is disabled.
  pluginMessaging:
    channel: nuvotifier:votes
