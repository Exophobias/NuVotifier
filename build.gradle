
import org.apache.tools.ant.filters.ReplaceTokens

plugins {
    id "com.github.spotbugs" version "6.5.12" apply false
    id "com.gradleup.shadow" version "9.6.1" apply false
}

allprojects {
    group = 'com.vexsoftware'
    version = '2.7.3-patriam.4'

    dependencyLocking {
        lockAllConfigurations()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: "com.github.spotbugs"

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(25)
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 25
        options.encoding = 'UTF-8'
    }

    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }

    repositories {
        mavenCentral()
        maven { url = "https://repo.papermc.io/repository/maven-public/" }
    }

    configurations {
        mockitoAgent { transitive = false }
    }

    dependencies {
        testImplementation platform("org.junit:junit-bom:6.1.3")
        testImplementation "org.junit.jupiter:junit-jupiter"
        testRuntimeOnly "org.junit.platform:junit-platform-launcher"
        testImplementation "org.mockito:mockito-core:5.24.0"
        mockitoAgent "org.mockito:mockito-core:5.24.0"
    }

    processResources {
        filter(ReplaceTokens, tokens: ["app.version": this.project.version])
    }

    test {
        useJUnitPlatform()
        jvmArgs "-javaagent:${configurations.mockitoAgent.asPath}"
    }

    tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
        def filterFile = project.file('spotbugs-exclude.xml')
        if (filterFile.exists()) {
            excludeFilter = filterFile
        }
        def reportFile = layout.buildDirectory.file("reports/spotbugs/${name}.html")
        reports {
            create("html") {
                required = true
                outputLocation = reportFile
                stylesheet = 'fancy-hist.xsl'
            }
        }
    }
}

tasks.register('verifyRelease') {
    group = 'verification'
    description = 'Test, statically analyze and package the Paper 26.3 release.'
    dependsOn subprojects.collect { "${it.path}:test" }
    dependsOn ':nuvotifier-api:spotbugsMain', ':nuvotifier-common:spotbugsMain', ':nuvotifier-bukkit:spotbugsMain'
    dependsOn ':nuvotifier-universal:shadowJar', ':nuvotifier-bukkit:verifyPaperApi'
    doLast {
        def artifact = project(':nuvotifier-universal').tasks.named('shadowJar').get().archiveFile.get().asFile
        new java.util.zip.ZipFile(artifact).withCloseable { archive ->
            def descriptor = archive.getEntry('plugin.yml')
            if (descriptor == null) throw new GradleException('Release jar lacks plugin.yml')
            def text = archive.getInputStream(descriptor).getText('UTF-8')
            def field = { key ->
                def line = text.readLines().find { it.startsWith(key + ':') }
                line?.substring(key.length() + 1)?.trim()?.replaceAll(/^['"]|['"]$/, '')
            }
            if (field('name') != 'Votifier' || field('version') != project.version.toString()
                    || field('api-version') != '26.3'
                    || field('main') != 'com.vexsoftware.votifier.NuVotifierBukkit') {
                throw new GradleException('Release plugin descriptor has unresolved or unexpected identity/version/target')
            }
            def commands = text =~ /(?ms)^commands:\s*\r?\n(.*?)(?=^permissions:|\z)/
            if (!commands.find()) throw new GradleException('Release plugin descriptor lacks commands')
            def commandSection = commands.group(1)
            ['nuvotifier', 'nvreload', 'testvote'].each { command ->
                if (!(commandSection =~ /(?m)^  ${command}:\s*$/).find()) {
                    throw new GradleException('Release plugin descriptor lacks required command: ' + command)
                }
            }
            println "release-plugin: Votifier ${field('version')} / Paper ${field('api-version')}"
        }
    }
}
